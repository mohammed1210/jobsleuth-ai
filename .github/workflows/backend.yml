name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend import check
        run: python -c "from main import app; print('backend import ok')"

      - name: Backend tests
        run: pytest -q

      # A real read-only page-one response MUST validate for the pilot.
      # No credentials, no vacancy imports, and no raw job descriptions logged.
      - name: DfE FIRST-PAGE source contract - required for pilot
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 99
        timeout-minutes: 3
        run: python -m scripts.probe_dfe

      # Upstream publish-date-only sorting is not a stable full snapshot.
      # Diagnostic only: green CI MUST NOT be interpreted as full-feed approval.
      - name: DfE FULL-SCAN diagnostic - advisory, NOT approved for import
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 99
        continue-on-error: true
        timeout-minutes: 5
        run: python -m scripts.probe_dfe --full

      - name: Isolated Supabase bootstrap and RLS tests
        timeout-minutes: 5
        run: bash ../ops/supabase/verify_fresh_project.sh
